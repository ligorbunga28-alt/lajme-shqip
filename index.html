<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lajme Shqip — Lajmet shqiptare nga e gjithë bota</title>
  <meta name="description" content="Lajme Shqip: Politikë, Ekonomi, Kronikë, Botë, Sport, Showbiz — nga Shqipëria, Kosova, rajoni dhe diaspora, plus çfarë shkruan media botërore për shqiptarët. Përditësuar çdo mëngjes në 06:00, ora e Londrës.">
  <meta name="theme-color" content="#121010">
  <meta property="og:title" content="Lajme Shqip">
  <meta property="og:description" content="Albanian news from Albania, Kosovo, the region and the diaspora — in one place.">
  <meta property="og:type" content="website">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png" sizes="48x48">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="alternate" type="application/rss+xml" title="Lajme Shqip — RSS" href="feed.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Optional: paste your store links here once the apps are published; the buttons appear automatically.
    window.LAJME_STORE = { android: '', ios: '' };
  </script>
</head>
<body>
  <div class="topstrip">
    <div class="wrap">
      <div class="left"><span id="strip-date"></span><span><span class="dot"></span><span id="strip-updated"></span></span></div>
      <div class="right">
        <button class="tool-btn" id="lang-btn" type="button">English</button>
        <button class="tool-btn" id="theme-btn" type="button" aria-label="Tema">Auto</button>
      </div>
    </div>
  </div>

  <header class="masthead">
    <div class="wrap">
      <a class="brand" href="#top" aria-label="Lajme Shqip — Kryesore"><h1 class="brand-name">Lajme <em>Shqip</em></h1></a>
      <nav class="nav" id="nav" aria-label="Seksionet"></nav>
      <div class="tools">
        <label class="search">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
          <input id="search" type="search" placeholder="Kërko…" aria-label="Kërko" autocomplete="off">
        </label>
        <a class="live-btn" href="#live" id="live-btn"><span class="pulse"></span>LIVE</a>
      </div>
    </div>
  </header>

  <div class="regionbar"><div class="wrap" id="regionbar" role="group" aria-label="Rajoni"></div></div>

  <div class="ticker" id="ticker">
    <div class="wrap">
      <span class="lbl" id="ticker-lbl">E FUNDIT</span>
      <div class="track"><div class="items" id="ticker-items"></div></div>
    </div>
  </div>

  <main class="page" id="main">
    <section class="content" id="content" aria-live="polite"></section>
    <aside class="rail" id="rail"></aside>
  </main>

  <footer class="footer"><div class="wrap" id="footer"></div></footer>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
