# Lajme Shqip — automatic news update, every morning at 06:00 London time.
#
# GitHub's scheduler only understands UTC, so the job is triggered at BOTH 05:00 and 06:00 UTC.
# The aggregator itself checks the clock in Europe/London and only does the work on the run that is
# 06:00 in London (05:00 UTC during British Summer Time, 06:00 UTC in winter). The other run exits
# in a second without changing anything.
#
# Want news more often? Uncomment the hourly line below and set UPDATE_HOUR to "any".
# (GitHub may delay scheduled runs by a few minutes when it is busy.)

name: Update news (06:00 London)

on:
  schedule:
    - cron: '0 5 * * *'   # 06:00 London during BST (late March → late October)
    - cron: '0 6 * * *'   # 06:00 London during GMT (late October → late March)
    # - cron: '20 * * * *'  # OPTIONAL: every hour (then set UPDATE_HOUR: "any" below)
  workflow_dispatch:        # lets you press "Run workflow" in the Actions tab at any time

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aggregate the news
        env:
          UPDATE_HOUR: '6'                                  # London hour that triggers the update ("any" = every run)
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}   # manual runs always update
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node aggregator/index.js

      - name: Commit and publish the new headlines
        run: |
          git config user.name "lajme-shqip-bot"
          git config user.email "lajme-shqip-bot@users.noreply.github.com"
          git add docs/data/news.json docs/feed.xml
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "News update — $(TZ=Europe/London date '+%d %b %Y %H:%M %Z')"
            git push
          fi
